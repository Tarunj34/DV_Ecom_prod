```yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: movie-app
  namespace: default
  labels:
    app: movie-app

spec:
  replicas: 5

  selector:
    matchLabels:
      app: movie-app

  template:
    metadata:
      labels:
        app: movie-app

    spec:
      containers:
        - name: movie-app
          image: tarun4642/multibranch-flask-app:build-1
          imagePullPolicy: Always

          ports:
            - containerPort: 5000
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
```
